version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: contenedor_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: DB-LABORATORIO

      
    ports:
      - "5432:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  pgdata: